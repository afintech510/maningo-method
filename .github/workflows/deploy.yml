name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-maningo-method
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/maningo-method
            git fetch --all --prune
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            curl -fsS --max-time 10 --retry 4 --retry-delay 3 --retry-connrefused http://localhost:3003/api/health >/dev/null \
              && echo "health OK (:3003)" \
              || echo "WARN: health check did not pass (deploy applied)"
