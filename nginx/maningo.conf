# Maningo Method — nginx server block
# Add this to /opt/hosthampton/nginx/nginx.conf on the VPS
# Also add maningo.hosthampton.com to the HTTP→HTTPS redirect server_name list

server {
  listen 443 ssl;
  server_name pilates.hosthampton.com;

  ssl_certificate     /etc/ssl/hosthampton/origin.pem;
  ssl_certificate_key /etc/ssl/hosthampton/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=()" always;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  # Cache static assets
  location /_next/static/ {
    proxy_pass http://host.docker.internal:3003;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Main proxy
  location / {
    set $maningo_upstream http://host.docker.internal:3003;
    proxy_pass         $maningo_upstream;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }

  # Block sensitive paths
  location ~ /\.(env|git) {
    deny all;
    return 404;
  }

  location /supabase/ {
    deny all;
    return 404;
  }
}
